<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SpeakUp Logo: Sprechblase mit Stift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C4CF1"/>
      <stop offset="0.55" stop-color="#6A5BF7"/>
      <stop offset="1" stop-color="#2FA8FF"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A78"/>
      <stop offset="1" stop-color="#FF6B4A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#231A5C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Hintergrund, randlos für maskable Icons -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="438" cy="84" r="46" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="64" cy="446" r="76" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="452" cy="420" r="22" fill="#FFC83D" opacity="0.85"/>

  <!-- Sprechblase -->
  <path d="M120 84 H392 C430 84 456 110 456 148 V300 C456 338 430 364 392 364 H250 L158 434 L177 364 H120 C82 364 56 338 56 300 V148 C56 110 82 84 120 84 Z"
        fill="#FFFDF7" filter="url(#soft)"/>

  <!-- Schallwellen in der Blase -->
  <g fill="none" stroke="#6C4CF1" stroke-width="15" stroke-linecap="round" opacity="0.9">
    <path d="M128 146 A 46 46 0 0 1 128 208"/>
    <path d="M154 126 A 76 76 0 0 1 154 228"/>
    <path d="M180 106 A 106 106 0 0 1 180 248"/>
  </g>

  <!-- Stift, diagonal in der Blase -->
  <g transform="translate(286 258) rotate(-36)" filter="url(#soft)">
    <!-- Radiergummi -->
    <rect x="-146" y="-25" width="38" height="50" rx="14" fill="#FFC83D"/>
    <!-- Zwinge -->
    <rect x="-112" y="-25" width="16" height="50" rx="5" fill="#D9D4F2"/>
    <!-- Stiftkörper -->
    <rect x="-100" y="-25" width="188" height="50" rx="14" fill="url(#pencil)"/>
    <rect x="-100" y="-25" width="188" height="14" rx="7" fill="#FFB39C" opacity="0.55"/>
    <!-- Holzspitze -->
    <path d="M88 -25 L150 0 L88 25 Z" fill="#FFE3B8"/>
    <!-- Mine -->
    <path d="M124 -9 L150 0 L124 9 Z" fill="#292244"/>
  </g>

  <!-- kleine Funken -->
  <g fill="#FFC83D">
    <path d="M404 116 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7z"/>
    <path d="M432 338 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" opacity="0.9"/>
  </g>
</svg>
