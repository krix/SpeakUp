<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SpeakUp – Englisch lernen mit Sprache &amp; Stift</title>
  <meta name="description" content="SpeakUp: Englisch-Vokabeln lernen mit Sprache und Stift. Freundliche Lern-App für Kinder ab 10 – ohne Werbung, ohne Konto.">
  <meta name="theme-color" content="#6C4CF1">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self' blob:">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SpeakUp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- SVG-Sprite: alle UI-Icons an einer Stelle -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5H14V15h-4v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c3.5 4 6 6.4 6 10a6 6 0 1 1-12 0c0-2 .8-3.6 2.2-5.2.2 1.7.9 2.7 1.8 3.2C11 8.8 12.2 6.2 12 3z"/></symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11" opacity=".5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 1 1 0 12h-1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M4 19h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7.5 9L12 4.5 16.5 9M4 19h16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M9.5 13.5h.01M13 13.5h.01M16.5 13.5h.01M8 17h8"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 9.5a4.2 4.2 0 0 1-.6 8.5z"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  </svg>

  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <!-- Startbildschirm / Splash -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="icons/icon-512.png" alt="" width="144" height="144" class="splash-logo">
      <h1 class="splash-title">SpeakUp</h1>
      <p class="splash-sub">Englisch lernen mit Sprache &amp; Stift</p>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="app-shell">
    <header class="app-header" id="app-header">
      <button type="button" class="icon-btn back-btn" id="back-btn" aria-label="Zurück" hidden>
        <svg class="icon"><use href="#i-back"/></svg>
      </button>
      <a class="brand" href="#/home" aria-label="SpeakUp – Startseite">
        <img src="icons/icon-192.png" alt="" width="44" height="44" class="brand-logo">
        <span class="brand-text">
          <strong>SpeakUp</strong>
          <small>Englisch lernen mit Sprache &amp; Stift</small>
        </span>
      </a>
      <div class="header-actions">
        <span class="points-chip" id="points-chip" title="Deine Punkte">
          <svg class="icon icon-star" aria-hidden="true"><use href="#i-star"/></svg>
          <span id="points-value">0</span>
          <span class="sr-only">Punkte</span>
        </span>
        <button type="button" class="icon-btn" id="sound-btn" aria-label="Toneffekte ausschalten" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#i-sound-on"/></svg>
        </button>
        <a class="icon-btn parent-btn" href="#/eltern" aria-label="Elternbereich (geschützt)">
          <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
        </a>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="loading-screen">
        <div class="spinner" aria-hidden="true"></div>
        <p>SpeakUp wird geladen …</p>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation">
      <a href="#/home" class="tab" data-tab="home">
        <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Lernen</span>
      </a>
      <a href="#/fortschritt" class="tab" data-tab="progress">
        <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>Fortschritt</span>
      </a>
      <a href="#/eltern" class="tab" data-tab="parent">
        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span>Eltern</span>
      </a>
      <a href="#/ueber" class="tab" data-tab="about">
        <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>Über</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="fx-root" class="fx-root" aria-hidden="true"></div>
  <div id="update-banner" class="update-banner" hidden>
    <span>Neue Wörter oder Version verfügbar!</span>
    <button type="button" class="btn btn-small btn-white" id="update-btn">Neu laden</button>
    <button type="button" class="icon-btn" id="update-dismiss" aria-label="Hinweis schließen">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
  </div>

  <noscript>
    <div class="noscript">SpeakUp braucht JavaScript. Bitte schalte JavaScript in deinem Browser ein.</div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
